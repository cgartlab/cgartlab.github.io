# 跨平台兼容：Windows exFAT 不支持 symlink，故使用 hoisted 模式
# macOS/Linux 上 hoisted 模式同样正常工作，无 phantom dep 风险
nodeLinker: hoisted
packages:
  - '.'
allowBuilds:
  esbuild: false
  sharp: false
  simple-git-hooks: false
  workerd: false
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread"
  - chokidar
  - semver

onlyTrustedDependencies:
  - "@trickfilm400/rollup-plugin-off-main-thread"
  - chokidar
  - semver

overrides:
  esbuild: ">=0.28.1"
  yaml: ">=2.8.3"
  chokidar: "5.0.0"
  brace-expansion@2: "^2.1.4"
  brace-expansion@5: "^5.0.9"
  nanoid@3: "^3.3.17"
  js-yaml@4: "^4.3.1"
  dompurify@3: "^3.4.13"
  mermaid@10: "^10.9.8"
  # 安全修复：fast-uri 主机混淆漏洞 (CVE-2026-18446 / GHSA-7p8r-x3mc-p8w7)
  # ajv 仍锁定 ^3.0.1，3.1.5 为同 minor 补丁，向后兼容
  fast-uri: "^3.1.5"
  # 安全修复：deepmerge-ts 递归对象图栈溢出 DoS (CVE-2026-40345 / GHSA-ggr8-5vv4-36mx)
  # astro-compress 仅用 deepmergeCustom({mergeArrays:false})，v8 保留该 API
  deepmerge-ts: "^8.0.1"
