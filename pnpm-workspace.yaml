# 跨平台兼容：Windows exFAT 不支持 symlink，故使用 hoisted 模式
# macOS/Linux 上 hoisted 模式同样正常工作，无 phantom dep 风险
nodeLinker: hoisted
allowBuilds:
  esbuild: false
  sharp: false
  simple-git-hooks: false
  workerd: false
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread'
  - chokidar
  - semver

packages:
  - .
onlyTrustedDependencies:
  - '@trickfilm400/rollup-plugin-off-main-thread'
  - chokidar
  - semver

overrides:
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  chokidar: 5.0.0
  dompurify@3: ^3.4.13
  esbuild: '>=0.28.1'
  js-yaml@4: ^4.3.1
  mermaid@10: ^10.9.8
  nanoid@3: ^3.3.17
  yaml: '>=2.8.3'
