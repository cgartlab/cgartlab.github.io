# 跨平台兼容：Windows exFAT 不支持 symlink，故使用 hoisted 模式
# macOS/Linux 上 hoisted 模式同样正常工作，无 phantom dep 风险
nodeLinker: hoisted
allowBuilds:
  esbuild: false
  sharp: false
  simple-git-hooks: false
  workerd: false
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread'
  - chokidar
  - semver

packages:
  - .
onlyTrustedDependencies:
  - '@trickfilm400/rollup-plugin-off-main-thread'
  - chokidar
  - semver

overrides:
  brace-expansion@2: ^2.1.4
  # 安全修复：brace-expansion 的 `{a},b}` 重写导致二次复杂度 CPU DoS (GHSA-q2hr-2g5m-vwhr)
  # 受影响 >=4.0.0 <5.0.12，5.0.12 为同 major 补丁
  brace-expansion@5: ^5.0.12
  chokidar: 5.0.0
  # 安全修复：deepmerge-ts 递归对象图栈溢出 DoS (CVE-2026-40345 / GHSA-ggr8-5vv4-36mx)
  # astro-compress 仅用 deepmergeCustom({mergeArrays:false})，v8 保留该 API
  deepmerge-ts: ^8.0.1
  # 安全修复：DOMPurify IN_PLACE 模式下 afterSanitize 钩子移除节点后，
  # 游离子树的事件处理器仍然存活，可导致 DOM XSS (GHSA-p98j-92pf-mc4p)
  # 受影响范围 >=3.4.13 <=3.4.15，3.4.16 起修复；mermaid 自身依赖 ^3.3.3，无需连带升级
  # 2026-10 新 advisory（SAFE_FOR_TEMPLATES bypass / IN_PLACE 钩子）将修补线推至 3.4.17，升一档补丁
  dompurify@3: ^3.4.17
  esbuild: '>=0.28.1'
  # 安全修复：fast-uri authority 注入 (GHSA-qw65-cvwx-89v3) + 未闭合括号主机混淆 (GHSA-58mr-gqgx-xq4g)
  # ajv 依赖 fast-uri ^3.0.1；2026-10 四条新通告（scheme 伪造 / 相对引用路径等价 / 主机混淆 /
  # 首段冒号 scheme 注入）统一把修补线推到 3.1.9，^3.1.9 为同 minor 补丁
  fast-uri: ^3.1.9
  # 安全修复：http-cache-semantics max-stale 处理不当可跨用户泄露缓存响应
  # (GHSA-ch52-4w7c-c8xp)，由 astro 链经 @astrojs/mdx / astro-compress 引入
  # 4.2.1 起修复，^4.2.1 当前解析到 4.3.0（同 major）
  http-cache-semantics: ^4.2.1
  # 安全修复：js-yaml maxTotalMergeKeys 未限制空 merge 源的 CPU 消耗
  # (GHSA-2883-xcg3-v3hh)，4.3.2 为同 minor 补丁
  js-yaml@4: ^4.3.2
  # katex 0.18 起 CSS 类名统一加 `katex-` 前缀（`.base` → `.katex-base`）。rehype-katex@7.0.1
  # 至今仍硬钉 `katex: ^0.16.0`，必须用 override 强制全树单一版本：生成 HTML 的 katex 与
  # 页面加载的 CSS 都来自同一版本，前缀变更天然对齐，不会出现类名错位。
  # 精确钉 0.18.10 的原因：0.18.11 被上游标记 deprecated（"误发且含破坏性变更，请用 0.19.0"），
  # 而 0.19 起把「缺失字形度量」并入 strict 语义；先停在 0.18 线最后一版未被弃用的版本。
  katex: 0.18.10
  mermaid@10: ^10.9.8
  # 安全修复：minimatch globparts 放大导致二次复杂度 DoS (GHSA-g3hv-75wg-m249)
  # eslint@10 → @eslint/config-array 依赖 minimatch ^10.2.4，而 10.x 无修补版（修补线直接跳到 11.0.1）；
  # @typescript-eslint/typescript-estree 同样依赖。11.x 保留 Minimatch 类与全部选项，
  # 全链路均为 dev 依赖（构建期/本地 lint），站点运行期不可达
  minimatch: ^11.0.1
  nanoid@3: ^3.3.17
  # 安全修复：sharp 整数溢出 (GHSA-rgj7-g3m4-5g8c)
  # astro-compress 依赖 sharp ^0.35，0.35.4 为同 minor 补丁
  # 安全修复：sharp 的 librsvg 依赖漏洞 (CVE-2026-96889 / GHSA-wq5f-xc86-pv6w)
  # 受影响 <0.35.5，0.35.5 为同 minor 补丁
  sharp: ^0.35.5
  # 安全修复：smol-toml parseKey 逐行重扫导致二次复杂度 DoS (GHSA-r4xh-jqrq-34v2)
  # 受影响 <=1.8.0；npm 上无 1.8.1，修复随 1.9.0 发布（同 major minor）
  # 由 astro > @astrojs/internal-helpers 引入
  smol-toml: '>=1.8.1'
  # 安全修复：source-map-js 索引 section offset 触发事件循环 DoS (GHSA-68fv-2mgg-jv7q)
  # 受影响 >=1.0.0 <1.2.2，1.2.2 为同 minor 补丁
  # 由 vue > @vueuse/core > @waline/client 引入（dev 侧另经 @antfu/eslint-config）
  source-map-js: ^1.2.2
  # 安全修复：SVGO removeScripts 可执行内容绕过
  # (GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87)，4.1.0 为同 major minor
  # astro-compress 仅用 svgo 做构建期 SVG 压缩，4.1.0 无破坏性变更
  svgo@4: ^4.1.0
  # 安全修复：undici WebSocket permessage-deflate 解压 DoS (GHSA-3wwx-pv8p-q78v)
  # 仅约束 7.x（miniflare 精确钉 7.29.0）；astro 链上的 undici 8.x 不受影响
  undici@7: ^7.29.1
  # 2026-10 新 advisory：undici 8.x 未处理异常导致 DoS (GHSA 多则，<8.12.2)，astro 链经 unifont 引入 8.11.2
  undici@8: ^8.12.2
  # 2026-10 新 advisory：zod 校验超大约束集合时内存耗尽 (GHSA-mrhx-c7xc-m3w5，<4.6.6)
  # @astrojs/sitemap 仍引入 zod 4.6.1，astro 链其他处已解析到 4.6.6+，统一定级收口
  zod: ^4.6.6
  # 安全修复：@vue/server-renderer 属性名黑名单缺 CR 导致 XSS (GHSA-g2v6-rqmx-r4w6)
  # 受影响 <3.5.42（或 3.6.0-rc.0 ~ 3.6.0-rc.6）；@vue/server-renderer 与 vue 同版本发布，
  # 故整体钉 vue 到同 minor 补丁 3.5.42，避免子包与 vue 核心版本错位
  # 由 @waline/client > @vueuse/core > vue 引入
  vue: ^3.5.42
  # 安全修复：postcss-selector-parser 扁平选择器解析二次复杂度 CPU DoS (GHSA-rj75-hqrm-r3gf)
  # 受影响 <7.1.6，7.1.6 为同 minor 补丁
  postcss-selector-parser: ^7.1.6
  yaml: '>=2.8.3'

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0

# ⚠️ 临时忽略，有移除条件，勿当常设配置
#
# GHSA-vfj7-8cjw-p6xm —— braces 深层嵌套模式栈耗尽 DoS（high）
#   引入路径（仅此一条）：astro-compress>fast-glob>micromatch>braces
#   为何现在不修：
#     1. 修复版 3.0.4 截至 2026-10-04 仍未发布（npm latest 仍为 3.0.3），
#        无可钉版本，overrides 写 ^3.0.4 会让 pnpm install 直接失败
#     2. astro-compress 仅在 astro.config.ts 构建期使用，依赖链不进构建产物；
#        触发该漏洞需攻击者可控的 glob 模式，站点运行期不可达
#   移除条件：braces 3.0.4 一经发布，改用 overrides 钉版并删除本段
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
