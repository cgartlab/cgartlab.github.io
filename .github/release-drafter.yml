name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
exclude-labels:
  - '🏁 good first issue'
  - '🤝 help wanted'
  - '🚧 status:blocked'
  - '💤 status:stale'
  - '🔥 priority:high'
  - '🌿 priority:low'
  - '📦 area:content'
  - '🎨 area:theme'
  - '⚙️ area:infra'
  - '🔍 area:seo'
categories:
  - title: '🚀 Features'
    labels:
      - '✨ type:enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - '🐛 type:bug'
  - title: '📝 Documentation'
    labels:
      - '📝 type:docs'
      - '🎯 milestone'
  - title: '🧰 Maintenance'
    labels:
      - '🔧 type:chore'
  - title: '💥 Breaking Changes'
    labels:
      - '💥 breaking'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - '💥 breaking'
  minor:
    labels:
      - '✨ type:enhancement'
      - '🎯 milestone'
  patch:
    labels:
      - '🐛 type:bug'
      - '📝 type:docs'
      - '🔧 type:chore'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPO/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION