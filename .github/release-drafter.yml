name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - '✨ type:enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - '🐛 type:bug'
  - title: '📝 Documentation'
    labels:
      - '📝 type:docs'
      - '🎯 milestone'
  - title: '🧰 Maintenance'
    labels:
      - '🔧 type:chore'
  - title: '💥 Breaking Changes'
    labels:
      - '💥 breaking'
  - title: '📦 Area Changes'
    labels:
      - '📦 area:content'
      - '🎨 area:theme'
      - '⚙️ area:infra'
      - '🔍 area:seo'
  - title: 'Other Changes'
    labels: []
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - '💥 breaking'
  minor:
    labels:
      - '✨ type:enhancement'
      - '🎯 milestone'
  patch:
    labels:
      - '🐛 type:bug'
      - '📝 type:docs'
      - '🔧 type:chore'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPO/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION