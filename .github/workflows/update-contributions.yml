name: Update GitHub Contributions

on:
  schedule:
    # 每 6 小时执行（UTC 0/6/12/18 → 北京时间 08/14/20/02）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --config.trustPolicy=off

      - name: Fetch contribution data from GitHub API
        run: pnpm update-gh-contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and push if data changed
        run: |
          if git diff --quiet src/data/github-contributions.json 2>/dev/null; then
            echo "no changes"
          else
            git add src/data/github-contributions.json
            git commit -m "chore(gh-contributions): update contribution calendar data"
            git push
          fi
