name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Covers the argus action's worst case (max-attempts=3 x 600s = 30 min +
    # install overhead); keep above max-attempts x timeout.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate argus-flash token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARGUS_FLASH_APP_ID }}
          private-key: ${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}

      # 固定 commit SHA 保证行为可重现；升级时更新为 cgartlab/argus main 最新 SHA
      - uses: cgartlab/argus/.github/actions/argus-review@c9a22d407f91f70fc94823bcd30a8c07b2b62851
        with:
          github-token: ${{ steps.app-token.outputs.token }}