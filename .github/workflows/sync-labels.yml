name: Sync Labels

on:
  push:
    paths:
      - 'labels.yml'
    branches: [main]
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install github-label-sync
        run: npm install -g @endbug/github-label-sync
      - name: Sync labels
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          github-label-sync \
            --labels labels.yml \
            --allow-added-labels \
            ${{ github.repository }}