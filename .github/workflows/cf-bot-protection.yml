name: CF Bot Protection

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'on = 开启 Bot Fight Mode, off = 关闭'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off

jobs:
  toggle-bot-fight-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get zone id
        id: zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_JSON=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=cgartlab.com")
          echo "$ZONE_JSON" | head -c 500
          echo
          ZONE_ID=$(echo "$ZONE_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('success') and d.get('result') else '')")
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          test -n "$ZONE_ID"

      - name: Toggle Bot Fight Mode
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          ACTION: ${{ inputs.action }}
        run: |
          curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/bot_fight_mode" \
            -d "{\"value\":\"$ACTION\"}"
