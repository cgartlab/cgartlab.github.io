name: Test Cloudflare API Token

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    name: Test API Permissions
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test 1 - Verify Token Validity
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Testing Token validity..."
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success"\s*:\s*true'; then
            echo "TEST1 PASSED: Token is valid"
          else
            echo "TEST1 FAILED: Token invalid or insufficient permissions"
            exit 1
          fi

      - name: Test 2 - Verify Workers Scripts Access
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Testing Workers Scripts access..."
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success"\s*:\s*true'; then
            echo "TEST2 PASSED: Token has Workers Scripts access"
          else
            echo "TEST2 FAILED: Missing Workers Scripts permissions"
            exit 1
          fi

      - name: Test 3 - Verify Wrangler Deploy Permission
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Testing Wrangler deploy permission..."
          npm install -g wrangler
          cat > wrangler.temp.jsonc << EOF
          {
            "name": "cgartlab-test",
            "compatibility_date": "2026-05-02",
            "assets": { "directory": "./dist" }
          }
          EOF
          echo "npx wrangler deploy --dry-run"
          npx wrangler deploy --dry-run || {
            echo "TEST3 FAILED: Wrangler deploy permission insufficient"
            exit 1
          }
          echo "TEST3 PASSED: Wrangler deploy permission OK"
          rm wrangler.temp.jsonc

      - name: Test Summary
        run: |
          echo "All API permission tests passed!"
