name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update_release_draft:
    # dependabot 的分支上这个 action 取不到配置（404），每个 bot PR 都会挂一个红叉；
    # 草稿只需要在 main 的 push 与手动触发时维护。
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          # 只维护草稿，不自动发布；发布由维护者手动点 Publish
          publish: false
        env:
          # release-drafter@v6 (probot) 需要显式传入 token，否则草稿不会被更新
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
