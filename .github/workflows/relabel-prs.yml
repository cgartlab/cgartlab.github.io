name: Relabel All PRs
on:
  workflow_dispatch:

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prLabels = {
              170: ["📝 type:docs", "📦 area:content"],
              169: ["✨ type:enhancement", "⚙️ area:infra"],
              168: ["✨ type:enhancement", "🎨 area:theme"],
              167: ["📝 type:docs", "⚙️ area:infra"],
              166: ["✨ type:enhancement", "📦 area:content"],
              165: ["🐛 type:bug", "🎨 area:theme"],
              164: ["🐛 type:bug", "🎨 area:theme"],
              163: ["✨ type:enhancement", "📦 area:content"],
              162: ["✨ type:enhancement", "📦 area:content", "⚙️ area:infra"],
              161: ["✨ type:enhancement", "⚙️ area:infra"],
              160: ["📝 type:docs", "📦 area:content"],
              159: ["🐛 type:bug", "📦 area:content"],
              158: ["🐛 type:bug", "📦 area:content"],
              157: ["🐛 type:bug", "🎨 area:theme"],
              156: ["🐛 type:bug", "🎨 area:theme"],
              153: ["🔧 type:chore", "🎨 area:theme"],
              152: ["✨ type:enhancement", "🎨 area:theme"],
              151: ["✨ type:enhancement", "🎨 area:theme"],
              150: ["🐛 type:bug", "⚙️ area:infra"],
              149: ["🐛 type:bug", "🎨 area:theme"],
              148: ["🔧 type:chore", "🎨 area:theme"],
              147: ["🐛 type:bug", "⚙️ area:infra"],
              146: ["✨ type:enhancement", "📦 area:content"],
              145: ["🐛 type:bug", "🎨 area:theme"],
              144: ["✨ type:enhancement", "🎨 area:theme"],
              143: ["✨ type:enhancement", "⚙️ area:infra"],
              142: ["✨ type:enhancement", "🎨 area:theme"],
              141: ["🔧 type:chore", "⚙️ area:infra"],
              140: ["📝 type:docs", "⚙️ area:infra"],
              126: ["✨ type:enhancement", "⚙️ area:infra"],
              125: ["✨ type:enhancement", "⚙️ area:infra"],
              124: ["✨ type:enhancement", "⚙️ area:infra"],
              123: ["✨ type:enhancement", "⚙️ area:infra"],
              122: ["🐛 type:bug", "⚙️ area:infra"],
              121: ["🐛 type:bug", "⚙️ area:infra"],
              119: ["🔧 type:chore", "⚙️ area:infra"],
              118: ["📝 type:docs"],
              117: ["✨ type:enhancement", "⚙️ area:infra"],
              116: ["📝 type:docs", "⚙️ area:infra"],
              115: ["📝 type:docs"],
              114: ["🐛 type:bug", "⚙️ area:infra"],
              112: ["🔧 type:chore", "📦 area:content"],
              110: ["🐛 type:bug", "🎨 area:theme"],
              109: ["✨ type:enhancement", "🎨 area:theme"],
              107: ["🐛 type:bug", "⚙️ area:infra"],
              106: ["🐛 type:bug", "⚙️ area:infra"],
              104: ["🐛 type:bug", "🎨 area:theme"],
              103: ["📝 type:docs", "⚙️ area:infra"],
              102: ["🐛 type:bug", "⚙️ area:infra"],
              100: ["✨ type:enhancement", "🎨 area:theme"],
            };

            const oldLabels = ["bug", "documentation", "duplicate", "enhancement", "invalid", "question", "wontfix", "dependencies", "javascript", "codex", "P0", "P1", "P2", "合规", "a11y", "i18n", "SEO", "performance", "good first issue", "help wanted"];

            for (const [prNum, labels] of Object.entries(prLabels)) {
              try {
                // Remove old labels first
                if (oldLabels.length > 0) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(prNum),
                    name: oldLabels[0],
                  }).catch(() => {});
                }
                // Add new labels
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNum),
                  labels: labels,
                });
                console.log(`✅ PR #${prNum}: ${labels.join(", ")}`);
              } catch (e) {
                console.log(`❌ PR #${prNum}: ${e.message}`);
              }
              await new Promise(r => setTimeout(r, 100));
            }