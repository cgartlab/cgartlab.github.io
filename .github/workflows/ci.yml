name: CI

on:
  push:
    branches: ['dev-*', 'main']
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ format('{0}-{1}', github.event_name, github.event.ref || github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --config.trustPolicy=off

      - name: Audit dependencies (fail on known vulnerabilities)
        run: pnpm audit --prod
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - run: pnpm build
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          # fetch-github-repos 构建时调用 GitHub API：注入只读 token 规避未认证 60 req/h 限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm verify-feed
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check docs are in sync
        run: pnpm sync-docs:check
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
