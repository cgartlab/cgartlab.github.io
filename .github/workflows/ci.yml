name: CI

on:
  push:
    branches: ['dev-*']
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ format('{0}-{1}', github.event_name, github.event.ref || github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --config.trustPolicy=off

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile unchanged"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore: update lockfile for pnpm overrides'
            git push
          fi

      - run: pnpm build
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - run: pnpm verify-feed
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
