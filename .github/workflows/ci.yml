name: CI

on:
  push:
    branches: ['dev-*']
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ format('{0}-{1}', github.event_name, github.event.ref || github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --config.trustPolicy=off

      - run: pnpm build
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - run: pnpm verify-feed
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
