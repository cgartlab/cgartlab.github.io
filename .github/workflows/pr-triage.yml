name: PR Triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  label:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
